version: "3.8"

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: zamana-ai-test-db
    environment:
      POSTGRES_DB: zamana_ai_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zamana_ai_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
